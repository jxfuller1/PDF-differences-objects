[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-differences-objects"
version = "0.2.0"
description = "Vector-native revision comparison for mechanical-drawing PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "PDF Differences Objects contributors"}]
keywords = ["cad", "pdf", "drawing", "revision", "inspection", "pyqt6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "PyQt6>=6.7,<7",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
benchmark = [
  "scipy>=1.12,<2",
]

[project.scripts]
pdf-differences-cli = "pdf_differences.cli:main"

[project.gui-scripts]
pdf-differences = "pdf_differences.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
